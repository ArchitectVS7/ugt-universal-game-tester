# UGT config for warzones (REAL game, browser adapter).
#
# Drives the actual Phaser game served by `npm run dev` in
# ../warzones/warzones-game (Vite, port 3000) through the UGT hooks installed
# in src/ugt-hooks.ts (window.__GET_STATE__/__SEND_ACTION__/__RESET_GAME__).
# The retired examples/warzones/sim_bridge.py (a Python re-implementation of
# the game) must NOT be used — same lesson as SpacerQuest's sim_bridge.ts.
#
# Action ids MUST stay in lockstep with the switch in
# warzones-game/src/ugt-hooks.ts.

project:
  name: "Warzones (real client)"
  version: "0.7.0-alpha"

engine:
  type: "browser"
  entry: "http://localhost:3000"
  step_delay_ms: 25

observation_space:
  type: "box"
  shape: 6
  mappings:
    - path: "turnNumber"
      min: 0
      max: 500
    - path: "player.credits"
      min: 0
      max: 1000000
    - path: "player.actionPoints"
      min: 0
      max: 20
    - path: "botsAlive"
      min: 0
      max: 30
    - path: "fog.discoveredCount"
      min: 0
      max: 100
    - path: "eventLogTotal"
      min: 0
      max: 100000

action_space:
  type: "discrete"
  size: 10
  actions:
    0: { name: "wait" }
    1: { name: "end_turn" }
    2: { name: "scan" }
    3: { name: "warp_safe_exit" }    # avoids sectors with alive Pirates
    4: { name: "warp_any_exit" }     # pirates included
    5: { name: "warp_pirate_exit" }  # deliberately enters an adjacent pirate sector
    6: { name: "combat_attack" }     # CombatScene: attack, or exit to map once resolved
    7: { name: "combat_flee" }       # CombatScene: attempt to flee
    8: { name: "trade_open" }        # GalaxyMapScene: click TRADE (needs port in sector)
    9: { name: "trade_exit" }        # TradingScene: leave the port back to the map

# Placeholder profile: Round 1 is playability verification, not training.
# Rewards realized exploration/economy deltas, not activity counters.
reward_profiles:
  explorer:
    formula: "(state.fog.discoveredCount - before.fog.discoveredCount) * 5 + (state.player.credits - before.player.credits) * 0.001"
    win_bonus: 100
    loss_penalty: 100
