# Feature map for SpacerQuest (Rimward) — Phase 1 `ugt verify`.
#
# Action names resolve to integer ids via ugt.config.yaml's action_space; state
# paths index the bridge's normalized state (rimward_gym_bridge.Bridge._state),
# which is a flat numeric view of the engine's own StateSummary. `before` is the
# state snapshot taken just before the feature's actions ran.
#
# Preconditions mirror the ENGINE's own legal-actions gating (die in hand, no
# active encounter, board non-empty, …) so a feature only runs when the engine
# actually advertises the underlying action — the bridge never fabricates one.
#
# Run (from the UGT repo root):
#   python3 -m ugt.cli verify --config integrations/spacerquest/ugt.config.yaml \
#       --feature-map integrations/spacerquest/feature-map.yaml --max-turns 60

features:
  - id: sign_contract_fills_hold
    description: "Signing a manifest-board contract puts it in the hold and spends a die"
    priority: critical
    precondition: "state.phaseDay == 1 and state.inEncounter == 0 and state.diceLeft > 0 and state.hasContract == 0 and state.boardCount > 0"
    action: sign_contract
    assertion:
      - "state.hasContract == 1"
      - "state.diceLeft < before.diceLeft"

  - id: buy_fuel_refuels
    description: "Buying fuel raises the tank and spends credits + a die"
    priority: critical
    precondition: "state.phaseDay == 1 and state.inEncounter == 0 and state.diceLeft > 0 and state.fuel < state.maxFuel and state.credits >= state.localFuelPrice"
    action: buy_fuel_max
    assertion:
      - "state.fuel > before.fuel"
      - "state.credits < before.credits"
      - "state.diceLeft < before.diceLeft"

  - id: travel_spends_die_never_mints_fuel
    description: "A jump spends the die and never increases fuel; on success the ship moves (or an interdiction interrupts)"
    priority: critical
    precondition: "state.phaseDay == 1 and state.inEncounter == 0 and state.diceLeft > 0 and state.fuel > 100"
    action: travel_random
    assertion:
      - "state.diceLeft < before.diceLeft"
      - "state.fuel <= before.fuel"

  - id: pay_debt_reduces_marker
    description: "Paying the Merchant Guild marker moves credits into the debt ledger (die-free)"
    priority: critical
    precondition: "state.phaseDay == 1 and state.inEncounter == 0 and state.credits > 0 and state.debt > 0"
    action: pay_debt
    assertion:
      - "state.debt < before.debt"
      - "state.credits < before.credits"

  - id: end_day_advances_calendar
    description: "end-day + start-day rolls the world to the next playable day"
    priority: critical
    precondition: "state.phaseDay == 1"
    action: end_day
    assertion:
      - "state.day > before.day"
      - "state.phaseDay == 1"

  - id: forfeit_cargo_clears_hold
    description: "Abandoning a carried contract clears the hold (the T-1604 anti-soft-lock escape hatch) — signs a board contract, then forfeits it"
    priority: major
    precondition: "state.phaseDay == 1 and state.inEncounter == 0 and state.diceLeft > 1 and state.hasContract == 0 and state.boardCount > 0"
    action: [sign_contract, forfeit_cargo]
    assertion:
      - "state.hasContract == 0"
      - "state.diceLeft < before.diceLeft"

  - id: explore_spends_die
    description: "Exploration spends the die (and burns fuel on the attempt)"
    priority: major
    precondition: "state.phaseDay == 1 and state.inEncounter == 0 and state.diceLeft > 0 and state.fuel > 60"
    action: explore
    assertion:
      - "state.diceLeft < before.diceLeft"
      - "state.fuel <= before.fuel"

  - id: wait_is_inert
    description: "A bare Wait ticks nothing — no credits, no fuel, no calendar movement"
    priority: minor
    precondition: "state.phaseDay == 1"
    action: wait
    assertion:
      - "state.day == before.day"
      - "state.credits == before.credits"
      - "state.fuel == before.fuel"

  - id: parity_no_blocked_from_legal
    description: "Across everything driven so far, ZERO ActionBlocked ever resulted from a legal-list pick and zero protocol errors (the T-1604 parity guarantee)"
    priority: critical
    precondition: "state.phaseDay == 1"
    action: wait
    assertion:
      - "state.blockedFromLegal == 0"
      - "state.protocolErrors == 0"
