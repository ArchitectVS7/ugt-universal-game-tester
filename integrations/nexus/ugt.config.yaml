# UGT config for nexus-world-builder (REAL Next.js game, HTTP adapter).
#
# Drives the actual running nexus-world-builder server (apps/game, `next dev`)
# over its three UGT test routes via NexusHttpAdapter — never a re-implementation
# (the sim_bridge lesson). See integrations/nexus/README.md for the run recipe.
#
# NOTE: the adapter does the string->int coercion (xp/credits arrive as BigInt
# decimal STRINGS) and derives the *Count fields below from player-state; the
# obs paths here index into the adapter's parsed state dict, not the raw route.
#
# Action ids MUST stay in lockstep with NexusHttpAdapter._compose_command.

project:
  name: "NEXUS World Builder (real server)"
  version: "0.1.0"

engine:
  type: "real_server"
  base_url: "http://127.0.0.1:3100"
  # api_key falls back to the TEST_API_KEY env var when omitted (preferred, so
  # the key is not committed). Must match the server's TEST_API_KEY.
  api_key: null
  episode_seed: "ugt-nexus-seed"
  difficulty: "normal"          # tutorial | normal | hardcore
  baseline: "post_tutorial"     # fresh leaves scan/connect/exploit LOCKED (R0/NX-P0-1)
  connect_timeout: 60.0
  request_timeout: 30.0
  step_cap: 1000

observation_space:
  type: "box"
  shape: 8
  mappings:
    - path: "level"
      min: 0
      max: 50
    - path: "xp"
      min: 0
      max: 1000000
    - path: "credits"
      min: 0
      max: 10000000
    - path: "rngCounter"
      min: 0
      max: 1000000
    - path: "discoveredServersCount"
      min: 0
      max: 200
    - path: "compromisedServersCount"
      min: 0
      max: 200
    - path: "missionsCompletedCount"
      min: 0
      max: 50
    - path: "gameStatus.completedStoryMissions"
      min: 0
      max: 8

action_space:
  type: "discrete"
  size: 20
  actions:
    0: { name: "status" }       # info — always available
    1: { name: "help" }
    2: { name: "missions" }
    3: { name: "scan" }         # recon — populates discoveredServers
    4: { name: "connect" }      # -> stateChanges.currentServerId (adapter carries it)
    5: { name: "ls" }           # requires a connection
    6: { name: "cat" }          # requires a connection
    7: { name: "analyze" }
    8: { name: "exploit" }      # seeded success roll -> compromise
    9: { name: "crack" }
    10: { name: "escalate" }
    11: { name: "backdoor" }
    12: { name: "download" }
    13: { name: "accept" }      # accept <mission_id> from live missions[]
    # R3 (exploit-hunter): ids 0-13 above are frozen in lockstep; 14-19 extend
    # the vocabulary for the robustness walk. State-driven/probe arg composition
    # lives in the R3 subclass; the base _compose_command only holds simple
    # defaults for talk/choose/disconnect/whoami/garbage.
    14: { name: "talk" }        # talk <npc_handle> — narrative contact verb
    15: { name: "choose" }      # choose <path> — Act-3 climax choice
    16: { name: "disconnect" }  # clears the carried currentServerId
    17: { name: "whoami" }      # info — bare
    18: { name: "action_18" }   # INTENTIONALLY unmapped in _compose_command:
                                #   sent verbatim -> "Command not found" (a refusal probe)
    19: { name: "garbage" }     # composes a nonsense token -> "Command not found"

# Placeholder profile: P0 is a playability/robustness bring-up, not training.
# Rewards realized progress (compromises + story-mission completions), not
# activity counters. Refined once the exploit-hunter/LLM tiers are wired (R2/R3).
reward_profiles:
  progress:
    formula: "(state.compromisedServersCount - before.compromisedServersCount) + 10 * (state.missionsCompletedCount - before.missionsCompletedCount)"
    win_bonus: 100
    loss_penalty: 0

# LLM playtest tier (L-006). ADDITIVE + ladder-inert: R1/R2/R3 and the
# exploit-hunter read only engine/observation_space/action_space/reward_profiles,
# never this block. It drives the prompt's "KEY VALUES" line and the per-run
# summary; every path below resolves into NexusHttpAdapter._read_state()'s own
# flat dict (reusing the existing state shape — nothing invented). No loss_path:
# NEXUS has no loss state (matching DDD / Nexus-Dominion precedent).
playtest:
  guide_char_budget: 3500
  terminal_char_budget: 600
  key_state_paths:
    - { path: "level", label: "level" }
    - { path: "credits", label: "credits" }
    - { path: "compromisedServersCount", label: "servers_owned" }
    - { path: "missionsCompletedCount", label: "missions_done" }
    - { path: "gameStatus.completedStoryMissions", label: "story_missions", note: "0..8 -> win at 8" }
  summary_paths:
    - { path: "credits", label: "credits_gained" }
    - { path: "compromisedServersCount", label: "servers_compromised" }
    - { path: "missionsCompletedCount", label: "missions_completed" }
  win_path: "gameStatus.isComplete"
  # rngCounter advances on EVERY command by design (NX-OBS-1), including a refused/
  # no-op one — without excluding it, the playtester's contradiction detector never
  # sees an "empty" delta for this game and can never auto-flag a stuck loop. Found
  # 2026-07-21 when a real Haiku playtest re-issued `accept the_breadcrumb` 11 times
  # after its first (and only) real effect, with the detector silently never firing.
  ignore_delta_fields:
    - "rngCounter"
  # ls/analyze render their payload into terminal text, not structured state, so they
  # ALWAYS look like a no-op delta regardless of whether they revealed something new.
  # Without this, the contradiction detector auto-flags normal repeatable recon as a
  # false-positive "stuck loop" (found 2026-07-21: `ls` on a fresh server connection).
  display_only_verbs:
    - "ls"
    - "analyze"
