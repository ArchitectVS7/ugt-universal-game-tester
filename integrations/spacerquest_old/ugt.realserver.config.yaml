# SpacerQuest — REAL-SERVER config (Phase 2, LLM balance playtester).
#
# Drives the live spacerquest-web server (Socket.IO + HTTP) through RealClientAdapter.
# The retired sim-bridge config (ugt.config.yaml) is kept for history; THIS file is the
# one to use for `ugt playtest` / run_llm_playtest.py against engine.type: real_server.
#
# Server must be running first — see PLAN-FORWARD.md "How to resume". For balance runs
# start it with CLASSIC_MODE=false so end_turn actually advances the day (classic mode
# blocks manual end-turn and caps play at DAILY_TRIP_LIMIT trips per real day).

project:
  name: "SpacerQuest"
  version: "4.0.0"

engine:
  type: "real_server"
  base_url: "http://127.0.0.1:3005"
  main_menu_screen: "main-menu"
  connect_timeout: 10.0
  render_quiet_period: 0.4
  # No server_cmd → ATTACH to an already-running server (same as spike/smoke/dod scripts).
  # To have the adapter spawn the server itself, uncomment:
  # server_cmd: "npx tsx src/app/index.ts"
  # server_cwd: "../SpacerQuest/spacerquest-web"
  # server_env_file: ".env.ugt"

# 21-element observation vector — identical paths to the retired sim-bridge config;
# every field is populated from the real /api/character (no stubs).
observation_space:
  type: "box"
  shape: 21
  mappings:
    # --- Character ---
    - path: "character.credits"
      min: 0
      max: 1000000

    - path: "character.score"
      min: 0
      max: 10000

    - path: "character.rank_index"
      min: 0
      max: 8

    - path: "character.current_system"
      min: 1
      max: 28

    - path: "character.trip_count"
      min: 0
      max: 500

    - path: "character.battles_won"
      min: 0
      max: 10000

    - path: "character.cargo_pods"
      min: 0
      max: 200

    - path: "character.destination"
      min: 0
      max: 28

    - path: "character.bank_balance"
      min: 0
      max: 1000000

    - path: "character.is_conqueror"
      min: 0
      max: 1

    # --- Ship ---
    - path: "ship.fuel"
      min: 0
      max: 20000

    - path: "ship.hull_strength"
      min: 0
      max: 199

    - path: "ship.hull_condition"
      min: 0
      max: 9

    - path: "ship.drive_strength"
      min: 0
      max: 199

    - path: "ship.weapon_strength"
      min: 0
      max: 199

    - path: "ship.shield_strength"
      min: 0
      max: 199

    - path: "ship.has_cloaker"
      min: 0
      max: 1

    - path: "ship.has_auto_repair"
      min: 0
      max: 1

    # --- Flags ---
    - path: "character.in_combat"
      min: 0
      max: 1

    - path: "character.is_lost"
      min: 0
      max: 1

    # --- Episode tracking ---
    - path: "turn_number"
      min: 0
      max: 1000

# ONLY the actions RealClientAdapter.ACTION_HANDLERS actually maps to the real game.
# Anything else must stay unmapped (NotImplementedError by design — never fabricate).
# Id 0 MUST remain "wait": the playtester's press_key path calls step(0) to refresh state.
#
# METHODOLOGY NOTES for reading campaign results (Gate B review, 2026-07-05):
# - accept_cargo always picks manifest slot 1 and confirms — contract CHOICE is not part
#   of the agent's strategy space. Metrics measure "loop economics under fixed contract
#   choice", not full-strategy play.
# - Combat rounds dominate the action budget (~9 attacks per encounter, every trip spawns
#   one) — expect ~60-70% of actions to be combat_attack in a competent run.
action_space:
  type: "discrete"
  size: 12
  actions:
    0:  { name: "wait" }
    1:  { name: "buy_fuel" }
    2:  { name: "accept_cargo" }
    3:  { name: "navigate_cargo_dest" }
    4:  { name: "deliver_cargo" }
    5:  { name: "upgrade_cheapest" }
    6:  { name: "end_turn" }
    7:  { name: "combat_attack" }
    8:  { name: "combat_retreat" }
    9:  { name: "upgrade_weapons" }
    10: { name: "upgrade_shields" }
    11: { name: "repair_ship" }

# Required by the config validator; the playtest tier does not use rewards.
# Kept meaningful (profit + progress + combat outcome deltas) in case an RL tier
# is ever pointed at the real server.
reward_profiles:
  balanced:
    formula: >
      (state.character.credits - before.character.credits) * 0.05
      + (state.character.score - before.character.score) * 5
      + (state.character.battles_won - before.character.battles_won) * 20
    win_bonus: 1000
    loss_penalty: 100

evaluation:
  victory_key: "player_won"

# Consumed only by `ugt playtest` — prompt construction + report knobs.
playtest:
  guide_char_budget: 6000
  terminal_char_budget: 600
  # Per-run summary metrics: DELTA of each numeric state path from the post-reset
  # baseline (battlesWon/Lost are cumulative across resets server-side, so deltas
  # are the only comparable form). Aggregated (mean/std/ci95) across --runs N.
  summary_paths:
    - { path: "character.score",       label: "score_gain" }
    - { path: "character.credits",     label: "credits_gain" }
    - { path: "character.rank_index",  label: "promotions" }
    - { path: "character.battles_won", label: "battles_won" }
    - { path: "character.battles_lost", label: "battles_lost" }
    # NOTE: character.trip_count is deliberately NOT a summary path — end_turn resets it
    # to 0 server-side mid-run (sawtooth), so its baseline delta under-counts. Count
    # navigate actions in the per-run action_counts instead.
  win_path: "character.is_conqueror"
  loss_path: "character.is_lost"
  key_state_paths:
    - path: "character.credits"
      label: "credits"
    - path: "character.score"
      label: "score"
      note: "win at 10000 (Conqueror)"
    - path: "character.rank_index"
      label: "rank_index"
    - path: "character.destination"
      label: "destination"
      note: ">0 = cargo contract signed; navigate_cargo_dest delivers it"
    - path: "character.trip_count"
      label: "trip_count"
      note: "at 2 you must end_turn before the next trip"
    - path: "character.in_combat"
      label: "in_combat"
      note: "1 = you are in combat; use combat_attack or combat_retreat"
    - path: "ship.fuel"
      label: "fuel"
    - path: "ship.hull_condition"
      label: "hull_condition"
