project:
  name: "SpacerQuest"
  version: "4.0.0"

engine:
  type: "simulation"
  entry: "node --import tsx sim_bridge.ts"

# 21-element observation vector — full game state + conqueror flag
observation_space:
  type: "box"
  shape: 21
  mappings:
    # --- Character ---
    - path: "character.credits"
      min: 0
      max: 1000000

    - path: "character.score"
      min: 0
      max: 10000

    - path: "character.rank_index"
      min: 0
      max: 8

    - path: "character.current_system"
      min: 1
      max: 28

    - path: "character.trip_count"
      min: 0
      max: 500

    - path: "character.battles_won"
      min: 0
      max: 10000

    - path: "character.cargo_pods"
      min: 0
      max: 200

    - path: "character.destination"
      min: 0
      max: 28

    - path: "character.bank_balance"
      min: 0
      max: 1000000

    - path: "character.is_conqueror"
      min: 0
      max: 1

    # --- Ship ---
    - path: "ship.fuel"
      min: 0
      max: 20000

    - path: "ship.hull_strength"
      min: 0
      max: 199

    - path: "ship.hull_condition"
      min: 0
      max: 9

    - path: "ship.drive_strength"
      min: 0
      max: 199

    - path: "ship.weapon_strength"
      min: 0
      max: 199

    - path: "ship.shield_strength"
      min: 0
      max: 199

    - path: "ship.has_cloaker"
      min: 0
      max: 1

    - path: "ship.has_auto_repair"
      min: 0
      max: 1

    # --- Flags ---
    - path: "character.in_combat"
      min: 0
      max: 1

    - path: "character.is_lost"
      min: 0
      max: 1

    # --- Episode tracking ---
    - path: "turn_number"
      min: 0
      max: 1000

# 40 discrete actions — IDs 0-14 are the RL training core (never change these).
# IDs 15+ are Phase 1 verification actions exposed only to the verifier.
action_space:
  type: "discrete"
  size: 40
  actions:
    # Core RL loop (0-14)
    0:  { name: "wait" }
    1:  { name: "navigate_cheap_fuel" }
    2:  { name: "navigate_cargo_dest" }
    3:  { name: "navigate_neighbor" }
    4:  { name: "buy_fuel" }
    5:  { name: "sell_fuel" }
    6:  { name: "accept_cargo" }
    7:  { name: "deliver_cargo" }
    8:  { name: "upgrade_cheapest" }
    9:  { name: "repair_ship" }
    10: { name: "combat_attack" }
    11: { name: "combat_retreat" }
    12: { name: "pub_gamble_wheel" }
    13: { name: "bank_deposit" }
    14: { name: "end_turn" }
    # Phase 1 extended coverage (15-39)
    15: { name: "upgrade_drives" }
    16: { name: "upgrade_weapons" }
    17: { name: "upgrade_shields" }
    18: { name: "upgrade_nav" }
    19: { name: "upgrade_life_support" }
    20: { name: "upgrade_robotics" }
    21: { name: "upgrade_cabin" }
    22: { name: "bank_withdraw" }
    23: { name: "buy_trans_warp" }
    24: { name: "buy_auto_repair" }
    25: { name: "buy_cloaker" }
    26: { name: "buy_star_buster" }
    27: { name: "dump_cargo" }
    28: { name: "join_patrol" }
    29: { name: "navigate_to_sun3" }
    30: { name: "navigate_to_polaris" }
    31: { name: "navigate_to_mizar" }
    32: { name: "visit_wise_one" }
    33: { name: "visit_sage" }
    34: { name: "read_space_news" }
    35: { name: "view_stats" }
    36: { name: "buy_drink" }
    37: { name: "view_registry" }
    38: { name: "buy_port" }
    39: { name: "sell_port" }

# Reward profiles — delta-based, NO step penalty.
# Step penalties cause cargo trading to be unprofitable (30-step trip = -30 penalty > +trip_bonus).
# Without penalties, agents learn to seek positive events rather than avoid "wasting" turns.
# Each profile amplifies different signals so 5 agents develop genuinely different strategies.
#
# PROFIT RULE (2026-07-04): reward realized profit, not raw activity. Every profit-blind
# `trip_count` term was replaced by an equivalent-magnitude NET-credits term. Net credits
# = payment received on delivery (economy.ts pay formula: base 1000 + fuel reimbursement +
# distance·value) MINUS fuel bought. So a haul that costs more than it pays scores negative,
# and the agent is optimized to make *profitable* trades — matching the game's own economy
# and the intended behavior of the automated multiplayer bots. Weights calibrated so a typical
# ~2000-credit haul yields roughly the old per-trip signal (trader 0.1→~200, balanced 0.05→~100).
reward_profiles:

  # Phase 2A: Trade-PREFERRED whole-game agent. All 10 actions available (trade + combat + upgrade);
  # preference is expressed by MATH, not by hiding actions. NET trading profit (credits) is the dominant
  # signal, so per-action trading pays far more than fighting. But every trip forces a combat encounter,
  # so winning those fights is modestly rewarded (battles_won) — enough that the agent learns to fight/survive
  # THROUGH encounters and keep delivering, instead of collapsing into a safe no-op (accept_cargo spam).
  # score term rewards delivery progress toward the win. Warrior will reuse this structure with the
  # credits/battles weights swapped.
  trader:
    formula: >
      (state.character.credits - before.character.credits) * 0.1
      + (state.character.score - before.character.score) * 3
      + (state.character.battles_won - before.character.battles_won) * 25
    win_bonus: 1000
    loss_penalty: 100

  # Phase 2B: Score-maximizing explorer — earn score points; trade profitably as a means to it.
  explorer:
    formula: >
      (state.character.score - before.character.score) * 10
      + (state.character.battles_won - before.character.battles_won) * 30
      + (state.character.credits - before.character.credits) * 0.015
    win_bonus: 2000
    loss_penalty: 200

  # Phase 2C: Combat-focused agent — win fights and upgrade weapons.
  warrior:
    formula: >
      (state.character.battles_won - before.character.battles_won) * 50
      + (state.ship.weapon_strength - before.ship.weapon_strength) * 10
      + (state.ship.shield_strength - before.ship.shield_strength) * 10
    win_bonus: 1500
    loss_penalty: 100

  # Phase 2D: Balanced survival agent — all signals equally weighted (trading rewarded by profit).
  balanced:
    formula: >
      (state.character.score - before.character.score) * 5
      + (state.character.battles_won - before.character.battles_won) * 20
      + (state.character.credits - before.character.credits) * 0.05
    win_bonus: 1000
    loss_penalty: 100

  # Phase 2E: Speedrun agent — win as quickly as possible, large win_bonus dominates.
  speedrun:
    formula: >
      (state.character.score - before.character.score) * 15
    win_bonus: 5000
    loss_penalty: 300

evaluation:
  victory_key: "player_won"

training:
  seed: 42
  algorithm: "PPO"
  total_timesteps: 150000          # Gate 1+ full-action problem is harder than the 6-action loop. NOT 500000.
  parallel_envs: 1
  checkpoint_freq: 25000
  # Gate 1+ (2026-07-04): RL sees ONLY these real action IDs. Order defines the agent's 0..N-1 index.
  # Widened from the 6-action trade core to add combat + weapon/shield upgrades so the warrior
  # profile has a reachable path to its reward (every trip generates an encounter → combatSession
  # active → combat_attack works). Shared by all profiles, so all 5 train on this same space.
  action_subset: [4, 6, 2, 7, 8, 14, 10, 11, 16, 17]
  # 4=buy_fuel 6=accept_cargo 2=navigate_cargo_dest 7=deliver_cargo 8=upgrade_cheapest 14=end_turn
  # 10=combat_attack 11=combat_retreat 16=upgrade_weapons 17=upgrade_shields
