# UGT config for DDD (deterministic dueling card game) — REAL engine via the
# JSON-lines subprocess HARNESS (packages/harness/bin/harness.mjs), never a
# re-implementation (the sim_bridge lesson).
#
# The DDD harness is a zero-dependency deterministic engine wrapper: one JSON
# request per line in, one response per line out, in order. DddHarnessAdapter
# (ugt/adapters/ddd_harness.py) spawns it and drives create/legal/act/replay.
# See integrations/ddd/README.md for the run recipe.
#
# NOTE: DDD is tested by INVARIANTS + determinism (integrations/ddd/invariants.py,
# verify_round1.py), NOT by reward shaping. The reward_profiles block below is
# VESTIGIAL — UgtConfig requires it, but the exploit-hunter/trial path never reads
# it. The trial scripts import DddHarnessAdapter directly and drive it by hand.
#
# Action ids MUST stay in lockstep with DddHarnessAdapter._select.

project:
  name: "DDD (deterministic card duel, real engine via harness)"
  version: "0.1.0"

engine:
  # "simulation": the harness is a JSON-lines stdin/stdout subprocess. The adapter
  # spawns it directly (Popen), so it also reads the DDD-specific keys below.
  type: "simulation"
  entry: "packages/harness/bin/harness.mjs"
  harness_entry: "/Users/vs7/Dev/Games/DDD/packages/harness/bin/harness.mjs"
  node_bin: "node"
  # harness_cwd defaults (in the adapter) to the DDD repo root inferred from
  # harness_entry; override with the DDD_HARNESS_CWD env var. harness_entry itself
  # is overridable with the DDD_HARNESS_PATH env var.
  decks: ["bb_competitive", "sw_competitive"]
  format: "COMPETITIVE"
  # All three waves ON — this is the game DDD actually ships: apps/ladder (a CI
  # gate) and apps/play (the human client) both enable all three. A config that
  # omits a wave key is NOT a smaller game, it is a DIFFERENT one: enabledWaves
  # lives inside the hashed GameState, and `legalActions` only enumerates
  # `prediction` values when chainsPredictions is on.
  enabledWaves:
    stanceEcho: true
    chainsPredictions: true
    typeTriangle: true      # D16 — the card-type triangle. Omitting the key read
                            # as `undefined` -> falsy -> triangle silently OFF.
  maxTurns: 50
  seed: "ddd-r1"

# Observation paths index into the adapter's NORMALIZED state dict
# (DddHarnessAdapter._normalize): turn, p0.*, p1.* seat summaries. These exist for
# UgtConfig validity + a future env.py path; the trial scripts read the normalized
# dict directly, not through this mapping.
observation_space:
  type: "box"
  shape: 8
  mappings:
    - path: "turn"
      min: 0
      max: 100
    - path: "p0.hp"
      min: 0
      max: 30
    - path: "p1.hp"
      min: 0
      max: 30
    - path: "p0.focus"
      min: 0
      max: 5
    - path: "p1.focus"
      min: 0
      max: 5
    - path: "p0.handCount"
      min: 0
      max: 7
    - path: "p0.deckCount"
      min: 0
      max: 40
    - path: "p1.deckCount"
      min: 0
      max: 40

# Every id is STRUCTURAL — it picks among the actions the HARNESS enumerated (and,
# for targets, among the candidates the harness's own `targets` op returned). No id
# consults card costs, rules or content: the adapter has no game knowledge.
action_space:
  type: "discrete"
  size: 13
  actions:
    0:  { name: "commit_first" }           # first legal COMMIT_SELECTION (deterministic)
    1:  { name: "commit_random" }          # a random legal COMMIT_SELECTION (adapter RNG)
    2:  { name: "commit_last" }            # last legal COMMIT_SELECTION (deterministic)
    3:  { name: "commit_with_targets" }    # a commit whose `targets` op offers candidates; FILL them
    4:  { name: "commit_no_targets" }      # a commit, targets left [] — the pre-`targets`-op control
    5:  { name: "commit_with_prediction" } # prediction != null (RARE cards, chainsPredictions on)
    6:  { name: "commit_modal" }           # modeIndex != null (modal card)
    7:  { name: "pass" }                   # COMMIT_PASS (legal only when nothing is affordable)
    8:  { name: "mulligan_keep" }          # MULLIGAN full:false
    9:  { name: "mulligan_full" }          # MULLIGAN full:true
    10: { name: "concede" }                # CONCEDE — the ONLY route to a CONCESSION result
    11: { name: "probe_illegal" }          # R3: deliberately illegal -> expect RULES_ERROR + inert
    12: { name: "probe_garbage" }          # R3: malformed action -> expect refusal + inert
  # CONCEDE is filtered out of every id EXCEPT id 10, so a stochastic policy can
  # never throw the match by chance. Ids 11/12 are the ONLY ones that send
  # something outside the harness's legal list — deliberately, so the engine's
  # refusal paths can be asserted state-inert. Every other id is drawn from the
  # legal list, so the adapter cannot send an illegal action by accident.

# VESTIGIAL — required by UgtConfig; UNUSED by the exploit-hunter/trial path.
# DDD is tested by invariants + determinism, not rewards. Do not add reward
# shaping here; if a reward-driven tier is ever wired, design it deliberately.
reward_profiles:
  _unused:
    formula: "0"
    win_bonus: 0
    loss_penalty: 0
