# UGT config for tarot-war (REAL game, browser adapter).
#
# Drives the actual React game served by `npm run dev` in ../tarot-war
# (Vite, port 5173) through the UGT hooks installed in src/ugt-hooks.ts
# (window.__GET_STATE__ / __SEND_ACTION__ / __RESET_GAME__(seed)).
# The hooks are transport only: they call the exact useGameState callbacks
# the UI buttons receive (never a re-implementation — sim_bridge lesson).
#
# Action ids MUST stay in lockstep with the dispatch table in
# tarot-war/src/ugt-hooks.ts.

project:
  name: "Tarot War (real client)"
  version: "0.2.0"

engine:
  type: "browser"
  entry: "http://localhost:5173"
  step_delay_ms: 25   # hooks resolve their own promise after React applies the action

observation_space:
  type: "box"
  shape: 6
  mappings:
    - path: "currentRound"
      min: 0
      max: 1000
    - path: "player1.score"
      min: 0
      max: 500
    - path: "player2.score"
      min: 0
      max: 500
    - path: "player1.deckCount"
      min: 0
      max: 44
    - path: "player2.deckCount"
      min: 0
      max: 44
    - path: "gameLogTotal"
      min: 0
      max: 100000

action_space:
  type: "discrete"
  size: 8
  actions:
    0: { name: "wait" }
    1: { name: "play_round" }        # Begin Battle / Draw Cards / Next Round button
    2: { name: "set_ai_easy" }       # difficulty picker — setup screen only,
    3: { name: "set_ai_medium" }     #   exactly like the real UI
    4: { name: "set_ai_hard" }
    5: { name: "set_mode_classic" }  # game-mode picker — setup screen only
    6: { name: "set_mode_survival" }
    7: { name: "set_mode_endless" }

# LLM playtest tier (L-005) — the "is it a good game?" balance tier. This game
# already uses the browser adapter (engine.type: browser), which playtest_game()
# supports directly in the DEFAULT action_id drive mode (dispatch through
# __SEND_ACTION__ into the real useGameState handlers) — no new drive mode. This
# block is additive + config-only: R1/R2/R3 build their own config shim and ignore
# it (UgtConfig tolerates unknown top-level keys). All paths resolve into the live
# __GET_STATE__ projection (ugt-hooks.ts) — no new state shape is invented here.
#
#   key_state_paths -> the prompt's "⚡ KEY VALUES" line (what the LLM watches).
#   summary_paths   -> cross-reset numeric delta banking in the report (banked
#                      across the auto-reset that follows a finished game).
#   terminal_char_budget -> the game has NO terminal-text hook; the state JSON +
#                      the KEY VALUES line carry all game info. Kept small.
# There is NO win_path/loss_path: `winner` is a STRING set for EITHER player
# ('player1'/'player2'), so bool(winner) would report a "win" whenever ANYONE
# won — a false signal. Omitted, matching DDD / Nexus-Dominion precedent.
playtest:
  guide_char_budget: 3000
  terminal_char_budget: 200
  key_state_paths:
    - { path: "gamePhase",         label: "phase", note: "pickers work ONLY in 'setup'; 'finished' ends the game — play_round then auto-resets" }
    - { path: "gameMode",          label: "mode" }
    - { path: "aiDifficulty",      label: "difficulty" }
    - { path: "currentRound",      label: "round" }
    - { path: "player1.score",     label: "P1 score" }
    - { path: "player2.score",     label: "Oracle score" }
    - { path: "player1.deckCount", label: "P1 deck" }
    - { path: "player2.deckCount", label: "Oracle deck" }
    - { path: "warCardCount",      label: "warPile", note: "rises during a war (tie); winner claims it" }
    - { path: "winner",            label: "winner" }
  summary_paths:
    - { path: "player1.score",  label: "p1_score_delta" }
    - { path: "player2.score",  label: "oracle_score_delta" }
    - { path: "gameLogTotal",   label: "log_growth" }
  # win_path / loss_path deliberately omitted — see block comment above.

# Placeholder profile: Round 1 is playability verification, not training.
# Rewards realized score margin, not activity counters.
reward_profiles:
  duelist:
    formula: "(state.player1.score - before.player1.score) - (state.player2.score - before.player2.score)"
    win_bonus: 50
    loss_penalty: 50
