# UGT integration config — Sokoban Mini
#
# DOCUMENTARY. `engine.type: custom` means env.py has no adapter to dispatch:
# the ladder scripts import `GodotTcpAdapter` and construct it themselves. So
# `ugt verify` / `ugt playtest` do not drive this game — the rungs below do:
#
#   python3 spike_sokoban.py           # raw TCP contract
#   python3 smoke_sokoban_adapter.py   # BaseAdapter contract
#   python3 verify_round1.py           # R1 — one level solved, F1-F5
#   python3 verify_round2.py           # R2 — all 3 levels, no-op probes
#   python3 verify_round3.py           # R3 — invariant fuzzer + replay
#
# Godot has no built-in UGT engine type, and none of the built-ins fit: it is
# not a web page (browser), and its frame-based _process() loop cannot do a
# blocking stdin.readline() the way a Python/Node script can (simulation) — a
# non-blocking TCP socket polled once per frame is Godot's natural idiom.
#
# `engine.entry` is intentionally absent: "custom" is the one type where it is
# optional, because there is no entrypoint for env.py to spawn. The adapter
# owns the bridge's lifecycle instead (see bridge_process.py).

project:
  name: "SokobanMini"
  version: "1.0.0"

engine:
  type: "custom"
  # Read by the ladder scripts, not by env.py.
  host: "127.0.0.1"
  # Omitted deliberately: bridge_process.py picks an EPHEMERAL port per run, so
  # two runs cannot collide and a stale bridge on the default 8910 can never be
  # silently mistaken for the one under test.
  # port: 8910
  game_dir: "../game"

observation_space:
  type: "box"
  shape: 6
  mappings:
    - { path: "level_index",     min: 0, max: 2 }
    - { path: "player_x",        min: 0, max: 32 }
    - { path: "player_y",        min: 0, max: 32 }
    - { path: "boxes_on_target", min: 0, max: 8 }
    - { path: "boxes_total",     min: 0, max: 8 }
    - { path: "moves_taken",     min: 0, max: 500 }

# The state also carries `grid` — the player-facing ASCII render (one string
# per row, classic Sokoban legend). It is not an observation MAPPING (those
# feed the numeric obs vector); the LLM tier reads it straight out of the
# state dict, and `invariants.py` cross-checks it against the scalars.

action_space:
  type: "discrete"
  size: 5
  actions:
    0: { name: "up" }
    1: { name: "down" }
    2: { name: "left" }
    3: { name: "right" }
    # The PRD's reset_level — the machine player's R key. Without it a wedged
    # box would end the episode; with it, retrying is a decision the pilot can
    # take, exactly like a human.
    4: { name: "reload" }

evaluation:
  victory_key: "all_levels_solved"

playtest:
  # Sokoban has no randomness at all — three fixed levels, no generation, no
  # hidden state. Every episode is the same three puzzles in the same order, so
  # episodes are replays by design and the effective sample size is 1 however
  # many are run. The LLM tier measures COMPETENCE here (solved / moves against
  # the committed 73-move reference sequence), never a rate. See
  # ugt/core/seeding.py.
  seeding: deterministic
  # `left` — the first move of level 1's committed solution, so the probe is
  # guaranteed to change the state rather than bounce off a wall (an inert probe
  # would make "two resets matched" vacuously true, and UGT refuses that).
  probe_action: 2

  # ── What the pilot is told it is doing (P10) ──────────────────────────────
  # Rendered ABOVE the state dump. The guide says it too, but from the bottom of
  # the prompt behind everything else.
  objective: >-
    Push every crate onto a target, on three levels in a row. Solving the third
    sets all_levels_solved and ends the game. Nothing is timed and nothing can
    kill you, but a crate pushed into a corner is lost forever — when that
    happens, `reload` is the correct move, not a failure.

  # ── The screen (P2) ──────────────────────────────────────────────────────
  # This game has NO prose. `main.tscn` is ColorRects with no Label, no font and
  # no message line, so the board IS the whole player-facing text channel — and
  # `GodotTcpAdapter.get_terminal_text()` carries it by joining the very rows
  # `board.gd::render_rows()` draws for the human.
  #
  # Measured: the widest shipped level renders 7 rows x 9 cols = 70 chars with
  # newlines. The default 400 would already fit, but a budget that cannot bind is
  # a budget that cannot warn if a level ever grows, so this is set from the
  # measurement with room to spare rather than left at a default that happens to
  # work.
  terminal_char_budget: 600

  # ── Fog of war (P5) — the pilot reads what a human reads, no more ─────────
  # There is no HUD in this game: a person at the keyboard sees the board and
  # NOTHING else. So each state field had to be justified rather than passed
  # through by default. Six of the eight are derivable by looking:
  # player_x/player_y are the `@`, boxes_on_target/boxes_total are the `*` and
  # `$` counts, level_solved is "every crate is a `*`", all_levels_solved is the
  # end of the game. level_index is not on screen but is not an advantage either
  # — a player who has solved two levels knows they are on the third.
  #
  # Two fields are held back from the state block, PROMPT-ONLY either way (the
  # report, the invariants and `evaluation.victory_key` all keep the full state)
  # — but for OPPOSITE reasons, so they use two different knobs. Presenting both
  # as "redactions" is what caused the defect in the second bullet:
  #
  #   moves_taken — FOG OF WAR. The game keeps this and never shows it to anyone
  #                 (see the integration README's HUD finding). It is also the
  #                 exact number this tier scores competence against, and a pilot
  #                 that can watch its own metric is being measured on a
  #                 different game from the one a human plays. So it is dropped
  #                 from EVERY channel the pilot reads — state block AND the
  #                 recent-action deltas: `redact_state_fields`.
  #   grid        — CONTEXT ECONOMY. Not hidden, MOVED. It is rendered as an
  #                 aligned ASCII board in the Terminal panel above, which is
  #                 what a player looks at; leaving it in the state block too
  #                 would spend context showing the same board twice, once with
  #                 JSON quoting that makes the columns harder to line up. So it
  #                 is dropped from the state block ONLY:
  #                 `hide_from_state_block`.
  #
  # What the old shape cost (integration README Finding 17): `grid` sat in
  # `redact_state_fields`, which also strips the deltas — so the board vanished
  # from all 12 history entries as well, and since a push to a non-target cell
  # moves no visible scalar, a crate-pushing move and a plain walk read
  # identically in the pilot's own notes (`Step 2: up → {'player_y': '-1'}`).
  # The game's one feedback signal reached the pilot on one channel only.
  redact_state_fields:
    - "moves_taken"
  hide_from_state_block:
    - "grid"

  # ── Memory (P10) ─────────────────────────────────────────────────────────
  # A crate route is 4-8 pushes with walking in between, and the value of the
  # history is remembering which directions were already refused from a cell.
  # 12 covers a whole crate's worth of work; the default 5 would forget the plan
  # halfway through executing it.
  #
  # Since the `hide_from_state_block` split above, each ACCEPTED move's entry
  # also carries the board's before→after pair, which is how a push is
  # distinguishable from a walk at all. Measured on this commit, on the widest
  # board (12 entries deep into level_03, 11x8 — the worst case in the shipped
  # content): the Recent Actions block is 3,515 chars and the whole prompt 9,333,
  # against 5,861 with an empty history. (level_02, 9x7: 2,847 and 8,639.) That
  # is affordable, and 12 STAYS: cutting the window to pay for the board would
  # move two variables across one P8 boundary, and the window length is what the
  # reasoning above was chosen for. This block has no char budget of its own in
  # the framework — `history_window` is its only bound (filed as a `ugt/` item in
  # the integration README's Finding 17).
  history_window: 12

  # ── P11, AND THE DEFAULT WAS UNPLAYABLE HERE ──────────────────────────────
  # The repeat guard counts consecutive IDENTICAL proposals regardless of whether
  # they changed the state, and at its default of 3 it hard-blocks the third one
  # and substitutes `wait`. But pushing a crate five cells along a row IS five
  # consecutive `left`s, and the committed reference solutions contain runs of
  # 5 (level_02) and 6 (level_03) — so on the default config the pilot is
  # physically prevented from playing the shipped solution, and the override
  # burns budget on a `wait` that does not touch the game.
  #
  # 8 permits every legitimate straight run in the shipped content (the widest
  # board is 9x7, so an interior straight line cannot exceed 7 cells) while still
  # bounding a genuinely unbounded loop. A pilot shoving repeatedly into a wall
  # is caught by the SEPARATE no-op detector, which is delta-gated and auto-flags
  # at 3 — that is the right mechanism for "stuck", and it is untouched by this.
  repeat_block_threshold: 8

  # ── Guide budget (P3) ────────────────────────────────────────────────────
  # Measured, not guessed: strategy-guide.md is 4,682 CHARS against a default
  # budget of 2,000. (`wc -c` says 4,704 — it counts bytes, and the guide has em
  # dashes. The budget is applied to `len(str)`, so the char figure is the one
  # that matters; playtest_sokoban.py measures it the same way the loop does
  # rather than shelling out to `wc`.)
  # The guide is cut from the END, and the end is where the
  # skill lives — corner deadlocks, push geometry, when to reload. The pilot
  # would have received the legend and the objective and none of the reasoning.
  # Re-measure (`wc -c strategy-guide.md`) whenever the guide is edited;
  # playtest_sokoban.py fails the run before contacting any model if it slips.
  guide_char_budget: 6000
  # The state block is 8 scalars minus the 2 held back above (~180 chars
  # serialized). 1,200 can still bind if a field is ever added, unlike the 4,000
  # default. NOTE the specific trap this avoids: `_compact_state_block` shrinks
  # the LARGEST LIST first, and `grid` is the only list here — so if `grid` ever
  # returned to the state block, a tight budget would silently drop the board
  # rows first. The budget applies to the state block only; the Recent Actions
  # block that now carries `grid` is bounded by `history_window`, not by this.
  state_char_budget: 1200

  # DELIBERATELY UNSET, each for a reason — absence here is a decision:
  #   narration_field: the game sends no prose (see P2 above), so there is no
  #     field to name. The board arrives through get_terminal_text instead.
  #   episode_seeds: nothing to rotate — `seeding: deterministic`, declared
  #     above and probed live before every run.
  #   ignore_delta_fields: the no-op detector must stay fully armed here. There
  #     is no clock or turn counter ticking underneath a stalled board, so a
  #     board that does not change really is a refused move.
  #   terminal_recall_budget: the framework's recall keeps the LATEST screen per
  #     (action, context) — and with action_context_path unset (below) that is up
  #     to five boards here, one per direction key, all but one of them stale,
  #     under a header that says the details are still valid unless the game has
  #     changed them since. In a game where every accepted move rewrites the
  #     whole screen that promise is false by construction, and five
  #     near-identical boards is an anti-signal for a pilot that already
  #     struggles to localise a glyph in a 7x5 grid. It also has no chronology
  #     and no diff. The board's history arrives as a before→after PAIR per step
  #     in Recent Actions instead (`hide_from_state_block` above), which is
  #     ordered, is a diff, and makes a refused or walked step visibly different
  #     from a push.
  #   action_context_path: `up` from one cell and `up` from another are
  #     different observations, but the position is two fields rather than one
  #     path, so plain per-action keying is the honest option.
  #   win_path / loss_path: there is no loss state at all, and the win is
  #     `all_levels_solved`, which `evaluation.victory_key` already names.
