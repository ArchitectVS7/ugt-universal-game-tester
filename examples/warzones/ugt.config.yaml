project:
  name: "Warzones"
  version: "1.0.0"

engine:
  type: "simulation"
  entry: "sim_bridge.py"

# Maps the 10-element observation vector from the bespoke WarzonesSimEnv
# into named fields exposed by sim_bridge.py
observation_space:
  type: "box"
  shape: 10
  mappings:
    - path: "turn"
      min: 0
      max: 500
    - path: "player.credits"
      min: 0
      max: 100000
    - path: "player.ap"
      min: 0
      max: 20
    - path: "player.sectors_owned"
      min: 0
      max: 1000
    - path: "enemy.sectors_owned"
      min: 0
      max: 1000
    - path: "player.hull"
      min: 0
      max: 100
    - path: "player.max_hull"
      min: 0
      max: 100
    - path: "enemy.bots_alive"
      min: 0
      max: 20
    - path: "game_over"
      min: 0
      max: 1
    - path: "player_won"
      min: 0
      max: 1

# Action space matches the bespoke WarzonesSimEnv exactly
action_space:
  type: "discrete"
  size: 5
  actions:
    0: { name: "end_turn" }
    1: { name: "scan" }
    2: { name: "deploy_fighter" }
    3: { name: "warp" }
    4: { name: "trade" }

# Simplified reward formulas — these approximate the bespoke reward functions
# but cannot express deltas, conditionals, or milestone tracking.
# The bespoke warzones_env_sim.py rewards use obs-delta tracking which is
# not available in UGT's declarative formula language.
reward_profiles:
  aggro:
    formula: "(state.player.credits * 0.001) + (state.player.sectors_owned * 5) - (state.turn * 2) - (state.enemy.bots_alive * 10)"
    win_bonus: 500
    loss_penalty: 100
  eco:
    formula: "(state.player.credits * 0.005) - (state.turn * 0.5) + (state.player.sectors_owned * 2)"
    win_bonus: 500
    loss_penalty: 200

training:
  seed: 42  # Reproducibility seed (change per experiment)
  algorithm: "PPO"
  total_timesteps: 100000
  parallel_envs: 1
  checkpoint_freq: 25000
