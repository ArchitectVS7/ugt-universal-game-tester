project:
  name: "BrowserExampleGame"
  version: "1.0.0"

engine:
  type: "browser"
  entry: "http://localhost:8080/index.html"
  step_delay_ms: 50

observation_space:
  type: "box"
  shape: 4
  mappings:
    - path: "player.credits"
      min: 0
      max: 1000
    - path: "player.ap"
      min: 0
      max: 10
    - path: "turns_elapsed"
      min: 0
      max: 30
    - path: "enemy.credits"
      min: 0
      max: 100

action_space:
  type: "discrete"
  size: 3
  actions:
    0: { name: "wait" }
    1: { name: "invest_credits" }
    2: { name: "end_turn" }
