# UGT integration config — Tiny Escape Room
#
# Generated against the REAL action table: `node ../game/src/bridge.js --actions`
# emits it straight from the CSVs, so these 41 ids cannot drift from the game.
# Regenerate with that command if the content files change.
#
# Tier 1: ugt verify --config ugt.config.yaml --feature-map feature-map.yaml
# Tier 2: python3 fuzz_escape_room.py
# Tier 3: ugt playtest --config ugt.config.yaml --strategy-guide strategy-guide.md

project:
  name: "TinyEscapeRoom"
  version: "1.0.0"

engine:
  type: "simulation"
  entry: "../game/src/bridge.js"

# Numeric-only projection of the raw state, required by UgtConfig and used by
# `ugt smoke-test`'s Gym Box space. The raw state (current_room, inventory list,
# flags dict, escaped) is what Tiers 1-3 actually assert on — see README.
#
# NOTE: the integration PRD suggested a `flags_set_count` mapping. That is not
# expressible: the obs aggregators (sum/mean/min/max/count) apply to LISTS only,
# and `flags` is a dict, so it silently reads 0. Mapping `escaped` instead keeps
# every mapped field real. Recorded in README.md under "Findings".
observation_space:
  type: "box"
  shape: 4
  mappings:
    - { path: "moves_taken",   min: 0, max: 200 }
    - { path: "rooms_visited", min: 0, max: 10 }
    - { path: "inventory",     min: 0, max: 12, aggregator: "count" }
    - { path: "escaped",       min: 0, max: 1 }

action_space:
  type: "discrete"
  size: 41
  actions:
    0: { name: "go_north" }
    1: { name: "go_south" }
    2: { name: "go_east" }
    3: { name: "go_west" }
    4: { name: "look" }
    5: { name: "inventory" }
    6: { name: "take_map_scrap" }
    7: { name: "drop_map_scrap" }
    8: { name: "examine_map_scrap" }
    9: { name: "examine_bunk_iron" }
    10: { name: "take_key_iron" }
    11: { name: "drop_key_iron" }
    12: { name: "examine_key_iron" }
    13: { name: "use_key_iron" }
    14: { name: "take_lantern" }
    15: { name: "drop_lantern" }
    16: { name: "examine_lantern" }
    17: { name: "use_lantern" }
    18: { name: "take_helmet_rusted" }
    19: { name: "drop_helmet_rusted" }
    20: { name: "examine_helmet_rusted" }
    21: { name: "take_flask_oil" }
    22: { name: "drop_flask_oil" }
    23: { name: "examine_flask_oil" }
    24: { name: "take_valve_wheel" }
    25: { name: "drop_valve_wheel" }
    26: { name: "examine_valve_wheel" }
    27: { name: "use_valve_wheel" }
    28: { name: "take_cog_bronze" }
    29: { name: "drop_cog_bronze" }
    30: { name: "examine_cog_bronze" }
    31: { name: "use_cog_bronze" }
    32: { name: "take_ledger" }
    33: { name: "drop_ledger" }
    34: { name: "examine_ledger" }
    35: { name: "use_ledger" }
    36: { name: "take_key_skeleton" }
    37: { name: "drop_key_skeleton" }
    38: { name: "examine_key_skeleton" }
    39: { name: "use_key_skeleton" }
    40: { name: "examine_mural_stone" }

evaluation:
  victory_key: "escaped"

playtest:
  # This game has NO randomness anywhere — one map, one solution, one ending, no
  # lose state. So every episode is a replay of the same scenario, and that is
  # correct rather than a bug: there is nothing to vary.
  #
  # Declaring it matters because "no seeds configured" used to mean two opposite
  # things — this, or an author who forgot and is about to publish a win rate
  # with an N-sized denominator over a 1-sized sample. UGT now refuses to guess,
  # and the declaration is probed against the live game before a run starts.
  #
  # The consequence for this game: the LLM tier measures COMPETENCE (did the
  # pilot escape, and in how many moves against the 26-move optimum), never a
  # rate. A win rate over N replays of one puzzle has a sample size of 1 however
  # large N is. See ugt/core/seeding.py.
  seeding: deterministic
  # `look` — always legal, always moves the state (it costs a move). The probe
  # needs an action that does something from the opening position, or "two resets
  # matched" would be vacuously true. Action 0 (`go_north`) would also work here;
  # 4 is chosen because it can never be gated by content edits.
  probe_action: 4

  # ── What the pilot is told it is doing (P10) ─────────────────────────────
  # Rendered ABOVE the state dump. The guide says this too, but from the bottom
  # of the prompt behind everything else.
  objective: >-
    Escape the prison: reach the courtyard, which sets escaped=true. The world is
    a chain of flag-gated locks — each room or object you unlock is what makes the
    next one reachable. Nothing is timed, nothing can kill you, and no action can
    make the game unwinnable, so exploring only costs moves.

  # ── The narration channel (found missing by the pre-flight, 2026-07-26) ──
  # The engine writes room descriptions, examine text and authored success/refusal
  # lines; `src/bridge.js` used to drop all of it, so a wire client played a text
  # adventure with NO TEXT. This names the field that carries it.
  narration_field: "info.message"

  # ── Context budgets — sized for THIS game, not copied ────────────────────
  # A comparable RPG integration runs ~20,000 chars per call because it has an
  # 8-mission story, a 35-verb surface and four revealed-content groups. This
  # game has 41 fixed actions, 10 rooms and 8 flags; the same budget would be
  # padding, and padding costs latency on a local model without adding knowledge.
  # Measured, not guessed — re-measure with `wc -c` when the guide changes:
  #   strategy-guide.md   3,206 chars  (budget 6,000 leaves room to edit)
  #   one state dump      ~450 chars   (6 keys, 8 flags, <= 9 inventory items)
  #   one narration line  ~120-260 chars
  # Total per call lands around 8,000 chars / ~2,000 tokens.
  guide_char_budget: 6000
  # ~6-9 recent narration lines: enough to hold a room description plus the
  # examines that followed it, which is what a human has on screen.
  terminal_char_budget: 1400
  # The state dump is tiny here; 4,000 (the default) would never bind, and a
  # budget that cannot bind is a budget that cannot warn.
  state_char_budget: 1500

  # ── Fog of war (P5) — the pilot plays with PLAYER-FACING INFO ONLY ───────
  # `flags` is internal machine state. Piping the same commands through
  # `node ../game/src/cli.js` prints those names ZERO times: a human infers the
  # chain from prose alone, and never learns a flag exists until the narration
  # tells them a door opened.
  #
  # Leaving them visible hands the pilot the puzzle's skeleton in the opening
  # cell — `knows_hour` + `clock_set` give away that there is a clock to set from
  # an hour you must learn, long before the ledger is findable — and any
  # competence figure measured that way is measuring a different, easier game.
  #
  # Redaction is PROMPT-ONLY: `evaluation.victory_key`, the invariant checks, the
  # episode records and the report all keep the full state. It also strips the
  # recent-action deltas, so a flag flip cannot leak through the history either.
  #
  # The progress signal the pilot is left with is the one a human has: the
  # narration. "The iron key grinds once in the banded door and snaps off in the
  # ward. The door swings open." That IS the flag flip, in player-facing form.
  redact_state_fields:
    - "flags"

  # ── Memory (P10) ─────────────────────────────────────────────────────────
  # The sliding window must be LONGER than the longest legitimate cycle or it can
  # never reveal one. Sweeping a room is look -> examine -> examine -> take (4-6
  # steps); walking back for a forgotten item is 6-10. 12 covers both. The
  # optimal solve is 26 moves, so this is roughly half a perfect run.
  history_window: 12
  # THE key setting for this game. The cumulative ledger is keyed by
  # (action, context), and here the context is the room you are standing in:
  # `examine ledger` in the Records Room is a real observation, and doing it
  # twice in the same room is a stuck signal. Without this, sweeping ten rooms
  # would read as ten repetitions of the same six verbs.
  action_context_path: "current_room"
  # P10 part 2 — retain the read layer. Object descriptions are printed ONCE into
  # the narration tail and are where the puzzle hints live; without recall the
  # pilot is structurally forced to re-examine things it already read, and
  # re-examining is a move it cannot get back.
  terminal_recall_budget: 1500
